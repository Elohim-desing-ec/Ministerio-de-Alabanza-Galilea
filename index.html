<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<div id="login-root"></div>

<div class="app" id="app">
  <!-- Barra lateral (escritorio) -->
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" href="#inicio">
      <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 15.5a7.5 7.5 0 0 1 15 0"/><circle cx="12" cy="15.6" r="1.7" fill="currentColor" stroke="none"/></svg></span>
      <span class="brand-text">
        <span class="brand-name">Selah</span>
        <span class="brand-sub" id="brand-sub">Galilea</span>
      </span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <a class="nav-item" href="#ajustes" data-route="ajustes">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Ajustes</span>
      </a>
      <button class="nav-item bell-item" type="button" data-bell>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span>Avisos</span><span class="nav-count bell-count" data-bell-count hidden></span>
      </button>
      <span class="sync" data-sync hidden><span class="sync-dot"></span><span class="sync-text">Conectando…</span></span>
      <button class="user-chip" id="user-chip" type="button" aria-label="Cambiar de persona"></button>
    </div>
  </aside>

  <div class="main-col">
    <!-- Barra superior (móvil) -->
    <header class="topbar">
      <a class="brand" href="#inicio">
        <span class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 15.5a7.5 7.5 0 0 1 15 0"/><circle cx="12" cy="15.6" r="1.7" fill="currentColor" stroke="none"/></svg></span>
        <span class="brand-name">Selah</span>
      </a>
      <div class="topbar-actions">
        <span class="sync sync--compact" data-sync hidden><span class="sync-dot"></span></span>
        <button class="btn btn--plain btn--icon btn--sm bell-btn" type="button" data-bell aria-label="Avisos"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="bell-dot" data-bell-count hidden></span></button>
        <a class="btn btn--plain btn--icon btn--sm" href="#ajustes" aria-label="Ajustes"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a>
        <button class="top-user" id="top-user" type="button" aria-label="Cambiar de persona"></button>
      </div>
    </header>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <!-- Pestañas (móvil) -->
  <nav class="tabbar" id="tabbar" aria-label="Navegación"></nav>
</div>

<div id="overlay-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>
